# Flow captive portal — resolve OS connectivity-check domains to the
# hotspot gateway so phones don't decide there's "no internet" and
# auto-disconnect. Deliberately NOT a "/#/" match-all: when the hotspot
# shares real upstream internet (e.g. Ethernet plugged into the laptop),
# ordinary domains must still resolve normally so real browsing works.
address=/connectivitycheck.gstatic.com/10.42.0.1
address=/connectivitycheck.android.com/10.42.0.1
address=/clients3.google.com/10.42.0.1
address=/captive.apple.com/10.42.0.1
address=/www.msftconnecttest.com/10.42.0.1
address=/www.msftncsi.com/10.42.0.1
