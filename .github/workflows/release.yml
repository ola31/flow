name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 필요: gh release create

env:
  # 2026-06-02 이후 Node 20 actions 가 강제 종료되므로 미리 Node 24 사용.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows
          - os: macos-latest
            artifact-name: macos
          - os: ubuntu-22.04          # glibc 호환성을 위해 24.04 대신 22.04 사용
            artifact-name: linux-x64
          - os: ubuntu-22.04-arm      # ARM64 Linux (Asahi, Raspberry Pi, Graviton)
            artifact-name: linux-arm64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        # Wrap in retry: apt mirrors on the runner occasionally rate-limit.
        run: |
          set -e
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libdbus-1-3 libfontconfig1 \
              libxkbcommon0 libxkbcommon-x11-0 \
              libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
              libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-xinerama0 libxcb-xkb1 && break
            echo "apt attempt $attempt failed, retrying in 15s…"
            sleep 15
          done

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Resolve version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        run: pyinstaller Flow.spec --noconfirm

      # ─── Windows: portable zip + Inno Setup installer ──────────────────────
      - name: Package portable zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path dist\Flow\* `
            -DestinationPath dist\Flow-portable-${{ steps.version.outputs.version }}.zip

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" `
            /DAppVersion=${{ steps.version.outputs.version }} `
            /DSourceDir=..\dist\Flow `
            /DOutputDir=..\dist `
            installer\Flow.iss

      # ─── macOS: zip the .app bundle ────────────────────────────────────────
      # 노타리제이션은 별도 단계 (Apple Developer ID 필요). 미서명 빌드는
      # 사용자가 처음 실행 시 우클릭→열기 해야 함.
      - name: Package .app zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -qr "Flow-macOS-${{ steps.version.outputs.version }}.zip" Flow.app

      # ─── Linux: AppImage (x86_64 + arm64) ──────────────────────────────────
      - name: Build AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euxo pipefail
          VER="${{ steps.version.outputs.version }}"
          ARCH=$(uname -m)   # x86_64 또는 aarch64

          # appimagetool 다운로드 — 아키텍처 별 바이너리. FUSE 없는 환경 대비
          # 압축 해제 후 그 안의 AppRun 으로 실행.
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${ARCH}.AppImage" -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract

          # AppDir 구조 만들기
          APPDIR=Flow.AppDir
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/512x512/apps"

          cp -r dist/Flow/. "$APPDIR/usr/bin/"
          cp assets/flow.desktop "$APPDIR/flow.desktop"
          cp assets/flow.desktop "$APPDIR/usr/share/applications/flow.desktop"
          cp assets/icon.png     "$APPDIR/flow.png"
          cp assets/icon.png     "$APPDIR/usr/share/icons/hicolor/512x512/apps/flow.png"

          # AppRun: AppImage 가 실행될 때 호출되는 launcher
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "${HERE}/usr/bin/Flow" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          ARCH=$ARCH ./squashfs-root/AppRun \
            "$APPDIR" "dist/Flow-${VER}-${ARCH}.AppImage"

          # tar.gz 로 감싸서 배포 — 브라우저 다운로드는 실행 권한(+x)을
          # 잃어버리는데, 그 상태로 더블클릭하면 GNOME 이 AppImage 를 디스크
          # 이미지로 착각해 "디스크에 복원" 창을 띄운다(잘못 누르면 디스크가
          # 통째로 덮어써짐). tar 는 권한을 보존하므로 압축 해제만 하면
          # chmod 없이 바로 실행된다.
          tar -czf "dist/Flow-${VER}-${ARCH}.AppImage.tar.gz" \
            -C dist "Flow-${VER}-${ARCH}.AppImage"

      # ─── Upload artifacts (per OS) ─────────────────────────────────────────
      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/Flow-Setup-*.exe
            dist/Flow-portable-*.zip
          if-no-files-found: error

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/Flow-macOS-*.zip
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/Flow-*.AppImage.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected artifacts
        run: ls -la artifacts/**

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Windows (installer) | `Flow-Setup-*.exe` |
            | Windows (portable) | `Flow-portable-*.zip` |
            | macOS (Apple Silicon) | `Flow-macOS-*.zip` — right-click → Open on first launch |
            | Linux x86_64 (Intel/AMD) | `Flow-*-x86_64.AppImage.tar.gz` — extract, then run |
            | Linux ARM64 (Asahi, RPi, Graviton) | `Flow-*-aarch64.AppImage.tar.gz` — extract, then run |
