name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

  smoke-build:
    name: PyInstaller smoke build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build
        # Flow.spec 가 깨지지 않았는지만 확인. 결과물은 업로드 안 함.
        run: pyinstaller Flow.spec --noconfirm

      - name: Verify exe runs
        # 실행 파일이 생성되었고 import 가 깨지지 않았는지 5초 동안만 띄워 확인.
        # 시작 자체가 실패하면 (exit non-zero) PR 이 빨갛게 표시됨.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          test -x dist/Flow/Flow
          timeout 5 dist/Flow/Flow || code=$?; \
            if [ "${code:-0}" -ne 124 ] && [ "${code:-0}" -ne 0 ]; then \
              echo "Flow crashed with exit $code"; exit 1; \
            fi
