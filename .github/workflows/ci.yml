name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # 2026-06-02 이후 Node 20 actions 가 강제 종료되므로 미리 Node 24 사용.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Qt system libraries
        # PySide6 needs these at import time even with QT_QPA_PLATFORM=offscreen.
        # Wrap in retry: apt mirrors on the runner occasionally rate-limit.
        run: |
          set -e
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libdbus-1-3 libfontconfig1 \
              libxkbcommon0 libxkbcommon-x11-0 \
              libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
              libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-xinerama0 libxcb-xkb1 && break
            echo "apt attempt $attempt failed, retrying in 15s…"
            sleep 15
          done

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        # xdist 워커 격리: PySide 테스트 스위트의 프로세스 전역 teardown
        # 크래시(간헐 segfault)가 전체 실행을 죽이지 않게 한다. 크래시한
        # 워커는 재시작되고 해당 테스트는 1회 재실행된다.
        run: |
          set -o pipefail
          pytest -q -n auto --reruns 1 --max-worker-restart 2 2>&1 | tee pytest.log

      - name: Surface failures as public annotations
        # 실패한 테스트 이름을 어노테이션으로 노출 — 어노테이션은 로그와
        # 달리 인증 없이 API로 조회할 수 있어 사후 진단이 쉬워진다.
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | sort -u | head -8 \
            | while IFS= read -r line; do echo "::error::${line}"; done
          tail -n 1 pytest.log | while IFS= read -r line; do
            echo "::error::${line}"
          done

  smoke-build:
    name: PyInstaller smoke build (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Qt system libraries
        run: |
          set -e
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y --no-install-recommends \
              libegl1 libgl1 libdbus-1-3 libfontconfig1 \
              libxkbcommon0 libxkbcommon-x11-0 \
              libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
              libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
              libxcb-xinerama0 libxcb-xkb1 && break
            echo "apt attempt $attempt failed, retrying in 15s…"
            sleep 15
          done

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build
        # Flow.spec 가 깨지지 않았는지만 확인. 결과물은 업로드 안 함.
        run: pyinstaller Flow.spec --noconfirm

      - name: Verify exe runs
        # 릴리스와 같은 스크립트를 쓴다 — 릴리스 때 처음 돌려보는 코드가
        # 되지 않도록. 워크스페이스를 미리 만들어 주므로 첫 실행 다이얼로그
        # 앞에서 멈추지 않고 메인 창 생성까지 지나간다.
        run: python scripts/smoke_launch.py --seconds 10
